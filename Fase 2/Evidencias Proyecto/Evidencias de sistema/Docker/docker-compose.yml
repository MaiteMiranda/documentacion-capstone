services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: barriostock_oracle_db
    ports:
      - "127.0.0.1:${ORACLE_PORT:-1522}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-change-me-in-local-env}
      APP_USER: ${DB_USER:-barriostock_user}
      APP_USER_PASSWORD: ${DB_PASSWORD:-change-me-in-local-env}
    volumes:
      - oracle_data:/opt/oracle/oradata
      - ./database/01_init.sql:/container-entrypoint-initdb.d/01_init.sql:ro
      - ./database/02_seed.sql:/container-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "/opt/oracle/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 90s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
    container_name: barriostock_backend
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-BarrioStock API}
      API_V1_STR: ${API_V1_STR:-/api/v1}
      SECRET_KEY: ${SECRET_KEY:-change-this-secret-in-production}
      DB_USER: ${DB_USER:-barriostock_user}
      DB_PASSWORD: ${DB_PASSWORD:-change-me-in-local-env}
      DB_HOST: oracle-db
      DB_PORT: 1521
      DB_SERVICE: ${DB_SERVICE:-FREEPDB1}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-mock_telegram_token}
      TELEGRAM_DEFAULT_CHAT_ID: ${TELEGRAM_DEFAULT_CHAT_ID:-}
    depends_on:
      oracle-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api/v1
    container_name: barriostock_frontend
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oracle_data:
