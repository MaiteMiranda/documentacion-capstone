version: '3.8'

services:
  oracle-db:
    image: gvenzl/oracle-free:23-slim
    container_name: barriostock_oracle_db
    ports:
      - "1521:1521"
    environment:
      - ORACLE_PASSWORD=BarrioStock2026!
      - APP_USER=barriostock_user
      - APP_USER_PASSWORD=BarrioStockPass2026!
    volumes:
      - oracle_data:/gvenzl/oracle-free
      - ./database/01_init.sql:/container-entrypoint-initdb.d/01_init.sql
      - ./database/02_seed.sql:/container-entrypoint-initdb.d/02_seed.sql
    restart: always

volumes:
  oracle_data: